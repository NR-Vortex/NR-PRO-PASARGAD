# Demo GraphQL Project Configuration
# ====================================
# Uses Countries API (https://countries.trevorblades.com/graphql)
# No authentication required — free public API for demos.

project_id: demo_graphql
name: "Demo GraphQL API"
description: "Countries GraphQL API — Countries, Continents, Languages"
api_type: graphql

# Authentication profile
auth:
  type: none
  description: "No authentication required — public API"

# Default environment
default_env: demo_graphql

# Path overrides — point to shared data locations
path_overrides:
  environments: "config/environments"
  testdata: "data/testdata"
  suites: "Execution/TestSuites"

# Excel workbook files (relative to testdata path)
workbooks:
  default: "Demo_GraphQL_TestData.xlsx"

# ADO integration (not configured for demo)
ado:
  project: ""
  plan_id: 0
  suite_id: 0
  area_path: ""
