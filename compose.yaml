name: nr-pro-pasargad

services:

  db:

    image: postgres:17-alpine

    container_name: nr-pro-pasargad-db

    restart: unless-stopped

    environment:
      POSTGRES_DB: ${DB_DATABASE:?Database name required}
      POSTGRES_USER: ${DB_USERNAME:?Database user required}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Database password required}

    ports:
      - "127.0.0.1:5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        - CMD-SHELL
        - 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"'

      interval: 5s
      timeout: 3s
      retries: 10


volumes:

  postgres_data: